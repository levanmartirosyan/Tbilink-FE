<header>
  <div class="container">
    <div class="logo" routerLink="/">
      <img src="assets/icons/logo.png" alt="Tbilink" />
      <h2>TBILINK</h2>
    </div>
    <nav>
      <div class="item" routerLink="/feed" routerLinkActive="active">
        <lucide-icon name="house" [size]="20"></lucide-icon>
      </div>
      <div class="item" routerLink="/search" routerLinkActive="active">
        <lucide-icon name="search" [size]="20"></lucide-icon>
      </div>
      <div class="item" routerLink="/messenger" routerLinkActive="active">
        <lucide-icon name="message-circle" [size]="20"></lucide-icon>
        @if (signalRService.totalUnreadCount() > 0) {
        <span class="unread-badge">{{signalRService.totalUnreadCount()}}</span>
        }
      </div>
      <div class="item">
        <lucide-icon name="bell" [size]="20"></lucide-icon>
      </div>

      <app-theme-switcher [size]="20"></app-theme-switcher>

      <div class="profile" #profileWrapper>
        <div class="avatar" (click)="toggleProfileMenu()">
          <img
            [src]="(userData?.data?.profilePhotoUrl ? env.storageUrl + userData?.data?.profilePhotoUrl : 'assets/icons/profile.png')"
            alt="Avatar"
          />
          <div
            class="statusIndicator"
            [class.active]="signalRService.isUserOnline(userData?.data?.id || '')"
          ></div>
        </div>

        <div class="profile-menu user-select-none" [class.active]="profileMenu">
          <div class="menu-item" routerLink="/profile">
            <lucide-icon name="user" [size]="17"></lucide-icon>
            <p>Profile</p>
          </div>
          <div class="menu-item" (click)="logout()">
            <lucide-icon name="log-out" [size]="17"></lucide-icon>
            <p>Log Out</p>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
