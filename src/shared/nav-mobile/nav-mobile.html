<div class="nav-top">
  <div class="logo">
    <img src="assets/icons/logo.png" alt="Tbilink" />
    <h2 routerLink="/">TBILINK</h2>
  </div>
  <div class="switcher">
    <div class="item-top">
      <lucide-icon name="bell" [size]="20"></lucide-icon>
    </div>

    <app-theme-switcher [size]="20"></app-theme-switcher>
  </div>
</div>

<div class="nav-bottom">
  <nav>
    <div class="item" routerLink="/feed" routerLinkActive="active">
      <lucide-icon name="house" [size]="24"></lucide-icon>
      <p>Home</p>
    </div>
    <div class="item" routerLink="/search" routerLinkActive="active">
      <lucide-icon name="search" [size]="24"></lucide-icon>
      <p>Search</p>
    </div>
    <div class="item" routerLink="/messenger" routerLinkActive="active">
      <div class="icon-wrapper">
        <lucide-icon name="message-circle" [size]="24"></lucide-icon>
        @if (signalRService.totalUnreadCount() > 0) {
        <span class="unread-badge"
          >{{ signalRService.totalUnreadCount() > 99 ? '99+' :
          signalRService.totalUnreadCount() }}</span
        >
        }
      </div>
      <p>Messenger</p>
    </div>
    <div class="item" routerLink="/profile" routerLinkActive="active">
      <lucide-icon name="user" [size]="24"></lucide-icon>
      <p>Profile</p>
    </div>
  </nav>
</div>
