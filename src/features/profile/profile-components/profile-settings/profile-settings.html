<div class="profile-settings">
  <div class="container">
    <div class="head">
      <lucide-icon
        name="arrow-left"
        [size]="24"
        routerLink="/profile"
      ></lucide-icon>
      <h2>Profile Settings</h2>
    </div>
    <app-segmented-switcher
      route="settings"
      [options]="['Profile', 'Account', 'Privacy', 'Notifications', 'Language']"
    ></app-segmented-switcher>

    <div class="settings-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
