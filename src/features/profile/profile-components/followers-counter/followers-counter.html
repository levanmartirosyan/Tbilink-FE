<div class="description-followers">
  <div class="descr">
    <p>{{userData?.description || 'No Description.'}}</p>
  </div>
  <div class="followers-counter">
    <div class="counter">
      <span>{{userData?.postCount | formatNumber}}</span>
      <p>Posts</p>
    </div>
    <div class="separator"></div>
    <div class="counter">
      <span>{{userData?.followersCount | formatNumber}}</span>
      <p>Followers</p>
    </div>
    <div class="separator"></div>
    <div class="counter">
      <span>{{userData?.followingCount | formatNumber}}</span>
      <p>Followings</p>
    </div>
  </div>
</div>
