<form [formGroup]="loginForm" (ngSubmit)="login()">
  <div class="inputs">
    <app-auth-input
      type="email"
      placeholder="Email"
      formControlName="email"
    ></app-auth-input>
    <app-auth-input
      type="password"
      placeholder="Password"
      formControlName="password"
    ></app-auth-input>
  </div>
  <div class="passRec">
    <span routerLink="/auth/recovery">Forgot your password?</span>
  </div>
  <app-auth-button
    text="Sign In"
    [isDisabled]="loginForm.invalid"
  ></app-auth-button>
</form>
