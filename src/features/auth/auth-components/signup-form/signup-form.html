<form [formGroup]="registerForm" (ngSubmit)="register()">
  <div class="inputs names">
    <app-auth-input
      type="text"
      placeholder="First Name"
      formControlName="firstName"
    ></app-auth-input>
    <app-auth-input
      type="text"
      placeholder="Last Name"
      formControlName="lastName"
    ></app-auth-input>
  </div>
  <div class="inputs">
    <app-auth-input
      type="email"
      placeholder="Email"
      formControlName="email"
    ></app-auth-input>
    <app-auth-input
      type="text"
      placeholder="Username"
      formControlName="userName"
    ></app-auth-input>
    <app-auth-input
      type="password"
      placeholder="Password"
      formControlName="password"
    ></app-auth-input>
    <app-auth-input
      type="password"
      placeholder="Repeat Password"
      formControlName="repPassword"
    ></app-auth-input>
  </div>
  <app-auth-button
    text="Sign Up"
    [isDisabled]="registerForm.invalid"
  ></app-auth-button>
</form>
