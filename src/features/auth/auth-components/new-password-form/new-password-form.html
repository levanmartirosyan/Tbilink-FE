<form [formGroup]="newPassForm" (ngSubmit)="saveNewPassword()">
  <div class="inputs">
    <app-auth-input
      type="password"
      placeholder="New Password"
      formControlName="password"
    ></app-auth-input>
    <app-auth-input
      type="password"
      placeholder="Repeat New Password"
      formControlName="repPassword"
    ></app-auth-input>
  </div>
  <app-auth-button
    text="Sign In"
    [isDisabled]="newPassForm.invalid"
  ></app-auth-button>
</form>
