<div class="add-post-card">
  <div class="top">
    <div class="profile-avatar">
      <div class="avatar">
        <img [src]=" 'assets/icons/profile.png'" alt="Avatar" />
        <div class="statusIndicator"></div>
      </div>
    </div>
    <div class="input">
      <textarea placeholder="What's on your mind?"></textarea>
    </div>
  </div>
  <div class="bottom">
    <div class="photos">
      <lucide-icon name="image" [size]="20"></lucide-icon>
      <span>Photo | Video</span>
    </div>
    <div class="btn">
      <button>Post</button>
    </div>
  </div>
</div>
