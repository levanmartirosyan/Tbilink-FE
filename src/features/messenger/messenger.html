<div class="messenger">
  <div class="container">
    <div class="side-bar">
      <div class="head">
        <div class="name">
          <lucide-icon name="message-circle" [size]="24"></lucide-icon>
          <h2>Chats</h2>
        </div>
      </div>
      <div class="chat-list">
        @for (chat of allChats; track $index) {
        <app-chat
          [chatData]="chat"
          (click)="selectChat(chat.participants)"
        ></app-chat>
        }
      </div>
    </div>
    <app-chat-area [otherUserId]="selectedChatParticipants"></app-chat-area>
  </div>
</div>
