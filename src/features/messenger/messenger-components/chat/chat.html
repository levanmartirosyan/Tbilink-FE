<div class="chat">
  <div class="left">
    <div class="avatar">
      <img [src]=" 'assets/icons/profile.png'" alt="Avatar" />
      <div class="statusIndicator active"></div>
    </div>
    <div class="chat-info">
      <h3>User Name</h3>
      <p>Last message preview...</p>
    </div>
  </div>
  <div class="right">
    <span class="timestamp">2m ago</span>
    <div class="unread-badge">
      <span>3</span>
    </div>
  </div>
</div>
