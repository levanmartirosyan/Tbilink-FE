<section>
  <div class="container">
    <div class="profile">
      <div class="cover-img">
        <img
          [src]="(userData?.coverPhotoUrl ? env.storageUrl + userData?.coverPhotoUrl : 'assets/icons/cover.png')"
          alt=""
        />
        @if (userData?.id == currentUserId) {
        <div class="settings-mobile">
          <div class="edit-cover">
            <lucide-icon name="camera" [size]="16"></lucide-icon>
            <p>Edit Cover</p>
          </div>

          <div class="settings" #settingsWrapper (click)="toggleSettingsMenu()">
            <lucide-icon name="cog" [size]="22"></lucide-icon>

            <div
              class="settings-menu user-select-none"
              [class.active]="settingsMenu"
            >
              <div class="menu-item" routerLink="/settings">
                <lucide-icon name="user-pen" [size]="17"></lucide-icon>
                <p>Edit Profile</p>
              </div>
              <div class="menu-item">
                <lucide-icon name="share-2" [size]="17"></lucide-icon>
                <p>Share Profile</p>
              </div>
              <div class="menu-item" (click)="logout()">
                <lucide-icon name="log-out" [size]="17"></lucide-icon>
                <p>Log Out</p>
              </div>
            </div>
          </div>
        </div>
        }
      </div>
      <app-profile-info [userData]="userData"></app-profile-info>
      <app-followers-counter [userData]="userData"></app-followers-counter>

      <div class="meta">
        <app-segmented-switcher
          [route]="profileRoute"
          [options]="['Posts', 'Photos', 'Reposts', 'About']"
        ></app-segmented-switcher>

        <div class="meta-info">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</section>
