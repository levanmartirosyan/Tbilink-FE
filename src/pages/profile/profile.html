<section>
  <div class="container">
    <div class="profile">
      <div class="cover-img">
        <img
          [src]="(userData?.coverPhotoUrl ? env.storageUrl + userData?.coverPhotoUrl : 'assets/icons/cover.png')"
          alt=""
        />
        <div class="edit-cover">
          <lucide-icon name="camera" [size]="16"></lucide-icon>
          <p>Edit Cover</p>
        </div>
      </div>
      <app-profile-info [userData]="userData"></app-profile-info>
      <app-followers-counter [userData]="userData"></app-followers-counter>

      <div class="meta">
        <app-segmented-switcher
          route="profile"
          [options]="['Posts', 'Photos', 'Reposts', 'About']"
        ></app-segmented-switcher>

        <div class="meta-info">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</section>
