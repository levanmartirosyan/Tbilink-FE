<div class="wrapper">
  @if (isLoading) {
  <app-spinner-loader></app-spinner-loader>
  } @else { @if (!userData?.isPublicProfile && userData?.id !== currentUserId) {
  <div class="isPrivate">
    <div class="info-row">
      <lucide-icon name="lock" [size]="17"></lucide-icon>
      <span>Profile is private</span>
    </div>
  </div>
  } @else { @for (photo of data; track $index) { @if (photo.imageUrl !== null &&
  photo.imageUrl !== '') {
  <div class="container" (click)="openImageModal(photo)">
    <img [src]="env.storageUrl + photo.imageUrl" alt="photo" />
  </div>
  } } @empty {
  <div class="empty-state">
    <lucide-icon name="image-off" [size]="28"></lucide-icon>
    <p>No photos found</p>
  </div>
  } } }
</div>

@if (imageModal && selectedImageUrl) {
<app-modal
  class="photo-modal"
  [isOpen]="imageModal"
  [hideFooter]="true"
  (onClose)="closeImageModal()"
>
  <div class="photo-modal-content">
    <img [src]="selectedImageUrl" alt="photo" />
  </div>
</app-modal>
}
