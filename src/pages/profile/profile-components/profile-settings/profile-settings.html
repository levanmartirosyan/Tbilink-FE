<div class="profile-settings">
  <div class="container">
    <div class="head">
      <lucide-icon
        name="arrow-left"
        [size]="24"
        [routerLink]="[`/profile/${userService.getUser()?.data?.userName}`]"
      ></lucide-icon>
      <h2>Settings</h2>
    </div>
    <app-segmented-switcher
      route="settings"
      [options]="['Profile', 'Account', 'Privacy', 'Notifications', 'Language']"
    ></app-segmented-switcher>

    <div class="settings-content">
      @if (isLoading) {
      <div class="loading">
        <app-spinner-loader></app-spinner-loader>
      </div>
      } @else {
      <router-outlet></router-outlet>
      }
    </div>
  </div>
</div>
