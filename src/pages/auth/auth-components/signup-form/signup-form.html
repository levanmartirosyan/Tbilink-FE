<form [formGroup]="registerForm" (ngSubmit)="register()">
  <div class="inputs names">
    <app-auth-input
      type="text"
      placeholder="First Name"
      formControlName="firstName"
    ></app-auth-input>
    <app-auth-input
      type="text"
      placeholder="Last Name"
      formControlName="lastName"
    ></app-auth-input>
  </div>
  <div class="inputs">
    <div class="input statusCheck">
      <app-auth-input
        type="email"
        placeholder="Email"
        formControlName="email"
        [className]="registerForm.get('email')?.hasError('pattern') ? 'checkError' : 'default'"
      ></app-auth-input>
      <!-- @if (registerForm.get('email')?.touched &&
      registerForm.get('email')?.hasError('pattern')) {
      <p class="checkErrorMessage">Enter a valid email address</p>
      } -->
    </div>

    <app-auth-input
      type="text"
      placeholder="Username"
      formControlName="userName"
    ></app-auth-input>
    <app-auth-input
      type="password"
      placeholder="Password"
      formControlName="password"
      [className]="registerForm.get('password')?.hasError('pattern') ? 'checkError' : 'default'"
    ></app-auth-input>
    <app-auth-input
      type="password"
      placeholder="Repeat Password"
      formControlName="repPassword"
      [className]="registerForm.get('repPassword')?.hasError('pattern') ? 'checkError' : 'default'"
    ></app-auth-input>
  </div>
  <app-auth-button
    text="Sign Up"
    [isDisabled]="registerForm.invalid"
  ></app-auth-button>
</form>
