<div class="admin-page">
  <div class="container">
    <div class="header">
      <div class="title">
        <lucide-icon name="shield-alert" [size]="28"></lucide-icon>
        <h1>Admin Panel</h1>
      </div>
      <p class="subtitle">Manage your platform from one central location</p>
    </div>
    <div class="counter-wrapper">
      <app-counters></app-counters>
    </div>
    <div class="switcher-wrapper">
      <app-segmented-switcher
        [options]="['Users','Posts','Comments','Bans']"
        [route]="'/admin'"
      >
      </app-segmented-switcher>
    </div>

    <div class="router-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
